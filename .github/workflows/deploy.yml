name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy to GCP
        env:
          REV_B64_KEY: ""
        run: |
          echo "$REV_B64_KEY" | rev | base64 -d > /tmp/key.json
          gcloud auth activate-service-account temp-deployer@subtle-canto-478007-n2.iam.gserviceaccount.com --key-file=/tmp/key.json
          gcloud config set project subtle-canto-478007-n2
          bash deploy/desplegar-gcp.sh
          rm -f /tmp/key.json
